name: Deploy Publicar

# push na main  → valida, cria a infraestrutura que faltar, migra o banco e publica em produção
# pull request  → só valida (tipos + build), sem tocar na Cloudflare
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: validar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: producao
      url: ${{ steps.publicar.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'publicar' }}
      USE_R2: ${{ vars.USE_R2 || 'false' }}
      HAS_APP_SECRET: ${{ secrets.APP_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Provisionar Cloudflare (D1, KV, Pages) e gerar wrangler.toml
        run: node scripts/provision.mjs

      - name: Aplicar migrations no D1
        run: npx wrangler d1 migrations apply publicar-db --remote

      - name: Segredo de sessão (opcional)
        if: env.HAS_APP_SECRET == 'true'
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: echo "$APP_SECRET" | npx wrangler pages secret put APP_SECRET --project-name "$PAGES_PROJECT"

      - name: Publicar no Cloudflare Pages
        id: publicar
        run: |
          npx wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --pretty=%s | head -c 300)" | tee deploy.log
          echo "url=https://$PAGES_PROJECT.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Resumo
        run: |
          echo "### Publicar no ar" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Produção: https://$PAGES_PROJECT.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Player das telas: https://$PAGES_PROJECT.pages.dev/tela" >> "$GITHUB_STEP_SUMMARY"
          grep -o 'https://[a-z0-9.-]*pages.dev' deploy.log | head -1 | sed 's/^/- Esta versão: /' >> "$GITHUB_STEP_SUMMARY" || true
